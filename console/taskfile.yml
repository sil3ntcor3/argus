version: '3'

tasks:
  e2e:install:
    desc: Install the matching Chromium headless browser for local checks
    cmds:
      - pnpm exec playwright install --only-shell chromium
  dev:security:
    desc: Serve the console on a separate port for isolated security smoke checks
    cmds:
      - pnpm run dev --host 127.0.0.1 --port 55173 --strictPort --mode test
    env:
      NODE_ENV: 'development'
      VITE_API_URL: 'http://127.0.0.1:56276'
      VITE_STORAGE_URL: 'http://127.0.0.1:59000'
  # Development environment setup and start
  # Starts the development server with hot-reload enabled
  # Environment: development mode
  dev:
    cmds:
      - pnpm run dev
    env:
      NODE_ENV: 'development'
  # Production build
  # Creates optimized production build of the application
  # Includes minification and bundling
  build:
    cmds:
      - pnpm run build
  # Install dependencies
  # Installs all project dependencies from package.json
  install:
    cmds:
      - pnpm install
  lint: pnpm run lint
  # Run tests
  # Executes unit and integration tests for the console application
  test:
    cmds:
      - pnpm run test
  # Run tests once (CI mode)
  # Executes unit and integration tests a single time without watch mode
  test:run:
    cmds:
      - pnpm run test:run {{.CLI_ARGS}}
  # Focused security-port browser checks against an already running isolated stack.
  e2e:security:
    cmds:
      - pnpm exec playwright test --config e2e/playwright.security.config.ts {{.CLI_ARGS}}
  # API documentation generation
  # Generates API documentation after ensuring API server is ready
  # Waits for API server health check before generating docs
  gen-api:
    cmds:
      - pnpm run gen:api
  clean:
    cmds:
      - rm -rf ./husky
      - rm -rf ./node_modules
